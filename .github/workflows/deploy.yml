name: Deploy Veil of Light
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Apply reviewed realism update
        if: hashFiles('realism-update.zip') != ''
        run: |
          unzip -oq realism-update.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist tools docs README.md
          git rm realism-update.zip
          git commit -m "Refine villa materials, furniture and daylight; retain source doors"
          git push
      - name: Check viewer JavaScript
        run: |
          node --check dist/app.js
          node --check dist/interior.js
          node --check dist/interior-design.js
          node --check dist/render-quality.js
          node tools/validate-interior.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
