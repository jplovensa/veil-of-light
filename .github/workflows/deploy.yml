name: Deploy Veil of Light
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Install reviewed furniture refinement
        if: ${{ hashFiles('veil-furniture-refinement.zip') != '' }}
        run: |
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path,PurePosixPath
          name='veil-furniture-refinement.zip'
          assert hashlib.sha256(Path(name).read_bytes()).hexdigest()=='5987659d1f91f81096d1def514020877d386174eb1f1c863f7dfe9e9dbec538a'
          with zipfile.ZipFile(name) as archive:
              for item in archive.infolist():
                  p=PurePosixPath(item.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert p.parts[0] in ['dist','tools','docs','README.md']
              archive.extractall('.')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist tools docs README.md
          git rm veil-furniture-refinement.zip
          git commit -m "Refine proposal furniture and relocate study inside the loft"
          git push
      - name: Check viewer JavaScript
        run: |
          node --check dist/startup.js
          node --check dist/app.js
          node --check dist/interior.js
          node --check dist/interior-design.js
          node --check dist/render-quality.js
          node --check dist/exterior.js
          node --check dist/exterior-palettes.js
          node --check dist/furniture-editor.js
          node tools/validate-interior.mjs
          node tools/validate-experience.mjs
      - name: Prepare source-floor checks
        run: npm install --prefix "$RUNNER_TEMP/veil-check" --no-save --ignore-scripts @gltf-transform/core@4.5.1 @gltf-transform/extensions@4.5.1 meshoptimizer@1.3.0
      - name: Check upstairs furniture placement
        env:
          VEIL_OPTIMIZER_ROOT: ${{ runner.temp }}/veil-check/node_modules
        run: node tools/validate-upstairs.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
