name: Publish Veil of Light
on:
  push:
    branches: [main]
    paths-ignore: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Unpack initial browser upload
        if: hashFiles('source-01.zip') != ''
        run: |
          for archive in source-*.zip; do unzip -oq "$archive"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist tools README.md .gitignore
          git rm source-*.zip
          git commit -m "Unpack Veil of Light source and model assets"
          git push
      - name: Check viewer JavaScript
        run: node --check dist/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
