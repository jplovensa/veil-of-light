name: Deploy Veil of Light
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check viewer JavaScript
        run: |
          node --check dist/startup.js
          node --check dist/app.js
          node --check dist/interior.js
          node --check dist/interior-design.js
          node --check dist/render-quality.js
          node --check dist/exterior.js
          node --check dist/exterior-palettes.js
          node --check dist/furniture-editor.js
          node tools/validate-interior.mjs
          node tools/validate-experience.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
