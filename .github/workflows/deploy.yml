name: Deploy Veil of Light
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Install reviewed viewer and model bundles
        run: |
          sha256sum -c <<'CHECKSUMS'
          d8924903c29b656908f56b45095400f6a759d1dcf0aabd005af87a844f3f5d11  veil-sky-models.zip
          588dc11412321d18c29e6bfab3ebe81183a7154502bc9b1a5b1e7a164a81090a  veil-sky-viewer.zip
          CHECKSUMS
          python3 - <<'PYCODE'
          import zipfile
          from pathlib import PurePosixPath
          for name in ['veil-sky-models.zip', 'veil-sky-viewer.zip']:
              with zipfile.ZipFile(name) as z:
                  for entry in z.infolist():
                      p=PurePosixPath(entry.filename)
                      assert not p.is_absolute() and '..' not in p.parts
                      assert p.parts[0] in ('dist','tools','docs','README.md')
                      assert entry.external_attr >> 16 & 0o170000 != 0o120000
                  z.extractall('.')
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist tools docs README.md
          git rm -- veil-sky-models.zip veil-sky-viewer.zip
          git commit -m 'Refine villa with reference beds, clear sofa placement and opening glass facades'
          git push
      - name: Check viewer JavaScript
        run: |
          node --check dist/startup.js
          node --check dist/app.js
          node --check dist/interior.js
          node --check dist/interior-design.js
          node --check dist/render-quality.js
          node --check dist/exterior.js
          node --check dist/exterior-palettes.js
          node --check dist/furniture-editor.js
          node --check dist/catalogue-materials.js
          node --check dist/bedside-lighting.js
          node --check dist/doors.js
          node tools/validate-interior.mjs
          node tools/validate-experience.mjs
      - name: Prepare source-floor checks
        run: npm install --prefix "$RUNNER_TEMP/veil-check" --no-save --ignore-scripts @gltf-transform/core@4.5.1 @gltf-transform/extensions@4.5.1 meshoptimizer@1.3.0
      - name: Check upstairs furniture placement
        env:
          VEIL_OPTIMIZER_ROOT: ${{ runner.temp }}/veil-check/node_modules
        run: |
          node tools/validate-upstairs.mjs
          node tools/validate-room-clearances.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
